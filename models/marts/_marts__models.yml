models:
  - name: fct__orders_analytics
    description: >
      One row per order -- the analytics table this capstone builds toward.
      Joins order, customer, item-aggregate, and payment data into a single
      wide table ready for a BI tool to query directly.

    columns:
      - name: order_id
        description: Primary key. One row per order.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: Foreign key back to stg_catalog__customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_catalog__customers')
                field: customer_id

      - name: order_status
        description: Current status of the order.
        data_tests:
          - accepted_values:
              arguments:
                values: ['PLACED', 'CONFIRMED', 'OUT_FOR_DELIVERY', 'DELIVERED', 'CANCELLED']

      - name: payment_status
        description: >
          Status of the resolved payment for this order. Can be null if an
          order has no payment record at all (left join).
        data_tests:
          - accepted_values:
              arguments:
                values: ['SUCCESS', 'PENDING', 'FAILED', 'REFUNDED']

      - name: customer_segment
        description: Customer segment (NEW / REGULAR / PREMIUM).
        data_tests:
          - accepted_values:
              arguments:
                values: ['NEW', 'REGULAR', 'PREMIUM']

      - name: net_revenue
        description: gross_item_revenue - discount_amount + delivery_fee, rounded via round_currency.
        data_tests:
          - non_negative